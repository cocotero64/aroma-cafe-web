<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aroma Café</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
    <header class="site-header">
        <div class="header-container">
            <a href="../index.html" class="brand-logo" aria-label="Aroma Café Home">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 8h1a4 4 0 1 1 0 8h-1"></path>
                    <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"></path>
                    <line x1="6" y1="2" x2="6" y2="4"></line>
                    <line x1="10" y1="2" x2="10" y2="4"></line>
                    <line x1="14" y1="2" x2="14" y2="4"></line>
                </svg>
                <span>Aroma Café</span>
            </a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="contact.html">Contact</a>
                <a href="login.html" class="active">Login</a>
            </nav>
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-ambient-glow" aria-hidden="true"></div>
        <div class="login-container">
            <div class="login-card">
                <div class="card-header">
                    <div class="coffee-badge" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                            <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                            <line x1="6" y1="1" x2="6" y2="4"></line>
                            <line x1="10" y1="1" x2="10" y2="4"></line>
                            <line x1="14" y1="1" x2="14" y2="4"></line>
                        </svg>
                    </div>
                    <h1>Welcome Back</h1>
                    <p class="subtitle">Fresh roasts and cozy moments await you. Sign in to your aroma rewards account.</p>
                </div>

                <div id="statusMessage" class="status-message" role="alert" aria-live="polite"></div>

                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="emailInput">Email or Username</label>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input 
                                type="text" 
                                id="emailInput" 
                                name="email" 
                                placeholder="name@aromacafe.com" 
                                required 
                                autocomplete="username"
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="passwordInput">Password</label>
                            <a href="#forgot" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                        </div>
                        <div class="input-container">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input 
                                type="password" 
                                id="passwordInput" 
                                name="password" 
                                placeholder="••••••••" 
                                required 
                                autocomplete="current-password"
                            >
                            <button 
                                type="button" 
                                id="togglePasswordBtn" 
                                class="toggle-password" 
                                aria-label="Toggle password visibility"
                            >
                                <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMeCheckbox" name="remember">
                            <span class="custom-checkbox"></span>
                            <span class="checkbox-label">Remember my session</span>
                        </label>
                    </div>

                    <button type="submit" id="submitLoginBtn" class="btn-submit">
                        <span class="btn-text">Sign In</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <div class="form-divider">
                    <span>or continue with</span>
                </div>

                <div class="social-auth">
                    <button type="button" class="social-btn" id="googleLoginBtn">
                        <svg viewBox="0 0 24 24" class="social-icon">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        <span>Google</span>
                    </button>
                    <button type="button" class="social-btn" id="appleLoginBtn">
                        <svg viewBox="0 0 24 24" fill="currentColor" class="social-icon">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.93-2.85-.9.04-2 0.6-2.65 1.35-.58.66-1.08 1.72-.94 2.74 1.01.08 2.04-.49 2.66-1.24z"></path>
                        </svg>
                        <span>Apple</span>
                    </button>
                </div>

                <div class="card-footer">
                    <p>New to Aroma Café? <a href="#signup" class="signup-link">Create an account</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p>Call us: (614) 555-O199</p>
            <p class="footer-sub">&copy; 2026 Aroma Café. Handcrafted with passion.</p>
        </div>
    </footer>

    <script>
        // Password toggle functionality
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('passwordInput');
        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                togglePasswordBtn.classList.toggle('active', type === 'text');
            });
        }

        // Form submission demo feedback
        const loginForm = document.getElementById('loginForm');
        const statusMessage = document.getElementById('statusMessage');
        if (loginForm && statusMessage) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('emailInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();

                if (!email || !password) {
                    statusMessage.className = 'status-message error';
                    statusMessage.textContent = 'Please fill in both email and password.';
                    return;
                }

                statusMessage.className = 'status-message success';
                statusMessage.textContent = `Welcome back, ${email}! Logging in...`;
                setTimeout(() => {
                    statusMessage.textContent = 'Demo login successful!';
                }, 1000);
            });
        }
    </script>
</body>
</html>
